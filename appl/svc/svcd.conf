# /lib/svcd.conf -- services to run on this host.
#
# One service per line:
#
#	name	command args...
#
# A leading '-' disables a service.  Quoting follows string(2), so a
# group of arguments containing spaces goes in single quotes.
#
# The command must stay in the foreground.  Services that daemonise
# (listen(1) without -s) are still supervised as a process group, but
# "-s" is the clearer configuration.
#
# Remote execution (see cpud(8)); the client is cpu(1) or rcmd(1).
# cpu	/dis/sh.dis -c 'listen -s tcp!*!rstyx {runas $user cpud &}'
#
# Read-only file service over Styx, for mount(1)/import(1).
# styx	/dis/sh.dis -c 'listen -s tcp!*!styx {export /&}'
#
# A test service: writes a line, sleeps, exits, and is restarted.
# tick	/dis/sh.dis -c 'echo tick; /dis/sleep.dis 3'
