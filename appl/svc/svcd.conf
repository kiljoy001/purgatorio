# /lib/svcd.conf -- services to run on this host.
#
# One service per line:
#
#	name	command args...
#
# A leading '-' disables a service.  Quoting follows string(2), so a
# group of arguments containing spaces goes in single quotes.
#
# The command must stay in the foreground.  Services that daemonise
# (listen(1) without -s) are still supervised as a process group, but
# "-s" is the clearer configuration.
#
# Remote execution (see cpud(8)).  listen(1) authenticates the caller
# with the certificates made by certify(8); init creates the signer key
# and the console user's certificate on first boot.  The client must
# name the same algorithm:
#
#	rcmd -e rc4_128 tcp!host!6668 echo hello
#
cpu	/dis/sh.dis -c 'listen -a rc4_128 tcp!*!6668 /dis/sh.dis /lib/cpusession.sh'
#
# Authenticated but unencrypted sessions, for a trusted wire:
# cpu	/dis/sh.dis -c 'listen -a none tcp!*!6668 /dis/sh.dis /lib/cpusession.sh'
#
# Read-only file service over Styx, also authenticated:
# styx	/dis/sh.dis -c 'listen -a rc4_128 tcp!*!styx /dis/export /'
#
# A restart test: writes a line, sleeps, exits, and is restarted.
# tick	/dis/sh.dis -c 'echo tick; /dis/sleep.dis 3'
