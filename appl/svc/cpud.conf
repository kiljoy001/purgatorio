# /lib/cpud.conf -- cpud command policy and session log.
#
# If there are no allow lines, cpud allows every command (compatible
# with rstyxd).  If there is at least one allow line, anything not
# listed is denied.  deny always wins.
#
# Note: allowing "sh" allows arbitrary commands inside the shell.  For
# a locked-down service, list only the commands users need and do not
# allow sh.
#
# allow sh
# allow ls
# allow cat
# allow ps
# allow netstat
# allow iostats
#
# log /tmp/cpud.log
