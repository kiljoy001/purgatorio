# Default service list, used when /n/host/svcd.conf is absent.
#
#	name	command args...
#
# svcd(8) starts each service in its own namespace and restarts it when
# it exits.  Output goes to /tmp/svcd/<name>.log.

# The Gemini server; it mints a certificate in /keydb on first start.
gem	/dis/gemserve.dis

# Keep the monoca epoch fresh.  It waits for /keydb/mono-signer if the
# host has not been provisioned yet.
monoca	/dis/monoca.dis daemon
